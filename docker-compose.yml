services:
  minio:
    image: minio/minio
    container_name: minio-recommender
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    container_name: shopai-api
    ports:
      - "8000:8000"
    depends_on:
      - minio
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
    volumes:
      - .:/app
    working_dir: /app
    command: python src/api/main.py

  streamlit:
    image: python:3.12-slim
    container_name: shopai-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - SHOPAI_API_URL=http://api:8000
      - SHOPAI_DB_PATH=/app/data/processed/shopai.db
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt -r dashboard/requirements.txt
      && streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0"

volumes:
  minio_data:
