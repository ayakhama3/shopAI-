<!DOCTYPE html>
<html class="light" lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Inscription ShopAI</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ba1a1a",
            "surface-container-lowest": "#ffffff",
            "on-primary": "#ffffff",
            "outline": "#76777d",
            "surface-container": "#eceef0",
            "surface": "#f7f9fb",
            "surface-container-high": "#e6e8ea",
            "surface-container-highest": "#e0e3e5",
            "secondary": "#9b4500",
            "secondary-container": "#fd8a42",
            "surface-variant": "#e0e3e5",
            "background": "#f7f9fb",
            "on-surface": "#191c1e",
            "primary": "#000000",
            "error-container": "#ffdad6",
            "surface-container-low": "#f2f4f6",
            "on-surface-variant": "#45464d",
            "outline-variant": "#c6c6cd",
            "on-background": "#191c1e"
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Montserrat', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .strength-bar { height: 4px; border-radius: 2px; transition: all 0.3s ease; }

    /* ── Toast intégré ── */
    #toast-container {
      position: fixed; top: 1.5rem; right: 1.5rem;
      z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem;
    }
    .toast-item {
      padding: 0.75rem 1.25rem; border-radius: 0.5rem;
      font-size: 0.875rem; font-weight: 500;
      color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.15);
      animation: slideIn .3s ease;
      max-width: 320px;
    }
    .toast-success { background: #16a34a; }
    .toast-error   { background: #dc2626; }
    .toast-info    { background: #2563eb; }
    @keyframes slideIn {
      from { opacity:0; transform: translateX(2rem); }
      to   { opacity:1; transform: translateX(0); }
    }
  </style>

  <!-- ✅ Toast défini INLINE — aucune dépendance externe -->
  <script>
    function toast(message, type) {
      type = type || 'info';
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        document.body.appendChild(container);
      }
      const el = document.createElement('div');
      el.className = 'toast-item toast-' + type;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => { el.remove(); }, 4000);
    }
  </script>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center">

<!-- Conteneur toast -->
<div id="toast-container"></div>

<!-- Header -->
<header class="w-full bg-surface border-b border-outline-variant shadow-sm sticky top-0 z-50">
  <div class="flex justify-between items-center w-full px-10 py-4 max-w-screen-xl mx-auto">
    <h1 class="text-2xl font-bold text-primary">ShopAI</h1>
    <a class="text-sm text-on-surface-variant hover:text-primary transition-colors" href="/login">Déjà membre ?</a>
  </div>
</header>

<main class="flex-1 w-full max-w-screen-xl mx-auto px-4 md:px-10 py-8 flex flex-col items-center">

  <!-- Stepper -->
  <div class="w-full max-w-lg mb-8">
    <div class="flex items-center justify-between relative">
      <div class="absolute top-1/2 left-0 w-full h-0.5 bg-surface-container-high -translate-y-1/2 z-0"></div>
      <div class="absolute top-1/2 left-0 w-1/3 h-0.5 bg-primary -translate-y-1/2 z-0 transition-all duration-500"></div>
      <div class="relative z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold shadow-md">1</div>
        <span class="mt-2 text-xs font-bold text-primary">Identité</span>
      </div>
      <div class="relative z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold border border-outline-variant">2</div>
        <span class="mt-2 text-xs text-on-surface-variant">Adresse</span>
      </div>
      <div class="relative z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-bold border border-outline-variant">3</div>
        <span class="mt-2 text-xs text-on-surface-variant">Préférences</span>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="w-full max-w-xl bg-white border border-outline-variant rounded-xl shadow-sm overflow-hidden">
    <div class="p-8 md:p-12">
      <div class="text-center mb-10">
        <h2 class="text-3xl font-bold text-primary mb-2">Créez votre compte</h2>
        <p class="text-sm text-on-surface-variant">Étape 1 : Vos informations personnelles</p>
      </div>

      <form class="space-y-6" id="registrationForm" novalidate>

        <!-- Nom complet -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-on-surface" for="full_name">Nom complet</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
            <input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              id="full_name" placeholder="Niserine Alami" type="text" autocomplete="name"/>
          </div>
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-on-surface" for="email">Adresse e-mail</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
            <input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              id="email" placeholder="contact@exemple.ma" type="email" autocomplete="email"/>
          </div>
        </div>

        <!-- Téléphone -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-on-surface" for="phone">Téléphone (Maroc)</label>
          <div class="flex">
            <div class="inline-flex items-center px-4 bg-surface-container-high border border-r-0 border-outline-variant rounded-l-lg text-on-surface-variant font-medium text-sm whitespace-nowrap">
              🇲🇦 +212
            </div>
            <input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-r-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              id="phone" placeholder="612345678" type="tel" pattern="[5-7][0-9]{8}" autocomplete="tel"/>
          </div>
        </div>

        <!-- Mot de passe -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-on-surface" for="password">Mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
            <input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              id="password" placeholder="••••••••" type="password" autocomplete="new-password"/>
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary"
              onclick="togglePassword()" type="button">
              <span class="material-symbols-outlined" id="eye_icon">visibility</span>
            </button>
          </div>
          <div class="pt-2">
            <div class="flex gap-1">
              <div class="strength-bar flex-1 bg-surface-container-high" id="bar-1"></div>
              <div class="strength-bar flex-1 bg-surface-container-high" id="bar-2"></div>
              <div class="strength-bar flex-1 bg-surface-container-high" id="bar-3"></div>
              <div class="strength-bar flex-1 bg-surface-container-high" id="bar-4"></div>
            </div>
            <p class="text-xs mt-1 text-on-surface-variant" id="password-feedback">Saisissez un mot de passe sécurisé</p>
          </div>
        </div>

        <!-- Confirmation -->
        <div class="space-y-1.5">
          <label class="block text-sm font-medium text-on-surface" for="confirm_password">Confirmer le mot de passe</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock_reset</span>
            <input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all text-sm outline-none"
              id="confirm_password" placeholder="••••••••" type="password" autocomplete="new-password"/>
          </div>
        </div>

        <!-- CGU -->
        <div class="flex items-start gap-3 py-2">
          <input class="mt-1 w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer"
            id="terms" type="checkbox"/>
          <label class="text-xs text-on-surface-variant cursor-pointer" for="terms">
            J'accepte les <a class="text-primary font-bold hover:underline" href="#">Conditions d'utilisation</a>
            et la <a class="text-primary font-bold hover:underline" href="#">Politique de confidentialité</a> de ShopAI.
          </label>
        </div>

        <!-- Bouton submit -->
        <button id="submitBtn"
          class="w-full bg-primary text-white py-4 rounded-lg font-bold text-sm shadow-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
          type="submit">
          Continuer
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>

      </form>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="w-full py-10 px-10 flex flex-col items-center gap-4 mt-8 border-t border-outline-variant bg-surface-container-high">
  <h3 class="text-xl font-bold text-primary">ShopAI</h3>
  <div class="flex flex-wrap justify-center gap-x-8 gap-y-2">
    <a class="text-xs text-on-surface-variant hover:text-primary" href="#">Légal</a>
    <a class="text-xs text-on-surface-variant hover:text-primary" href="#">Confidentialité</a>
    <a class="text-xs text-on-surface-variant hover:text-primary" href="#">Conditions</a>
    <a class="text-xs text-on-surface-variant hover:text-primary" href="#">Aide</a>
  </div>
  <p class="text-xs text-on-surface-variant opacity-70">© 2024 ShopAI Platform. Tous droits réservés.</p>
</footer>

<script>
  // ── Afficher/masquer mot de passe ──────────────────────────────────────────
  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eye_icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  // ── Indicateur de force ────────────────────────────────────────────────────
  document.getElementById('password').addEventListener('input', function () {
    const val = this.value;
    let strength = 0;
    if (val.length > 5)  strength++;
    if (val.length > 8  && /[A-Z]/.test(val)) strength++;
    if (val.length > 10 && /[0-9]/.test(val)) strength++;
    if (val.length > 12 && /[^A-Za-z0-9]/.test(val)) strength++;

    const colors  = ['', '#dc2626', '#f97316', '#16a34a', '#15803d'];
    const labels  = ['', 'Faible', 'Moyen', 'Fort', 'Très fort'];
    const feedback = document.getElementById('password-feedback');

    for (let i = 1; i <= 4; i++) {
      const bar = document.getElementById('bar-' + i);
      bar.style.backgroundColor = i <= strength ? colors[strength] : '#e6e8ea';
    }
    feedback.textContent  = val ? labels[strength] || 'Fort' : 'Saisissez un mot de passe sécurisé';
    feedback.style.color  = val ? colors[strength] : '#45464d';
  });

  // ── Soumission ─────────────────────────────────────────────────────────────
  document.getElementById('registrationForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const full_name        = document.getElementById('full_name').value.trim();
    const email            = document.getElementById('email').value.trim();
    const phone            = document.getElementById('phone').value.trim();
    const password         = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const terms            = document.getElementById('terms').checked;
    const btn              = document.getElementById('submitBtn');

    // ── Validations client ────────────────────────────────────────────────
    if (!full_name)                        { toast('Veuillez entrer votre nom complet.', 'error');         return; }
    if (!email || !email.includes('@'))    { toast('Adresse e-mail invalide.', 'error');                   return; }
    if (!phone || phone.length < 9)        { toast('Numéro de téléphone invalide.', 'error');              return; }
    if (password.length < 6)              { toast('Le mot de passe doit faire au moins 6 caractères.', 'error'); return; }
    if (password !== confirm_password)     { toast('Les mots de passe ne correspondent pas.', 'error');    return; }
    if (!terms)                            { toast("Acceptez les conditions d'utilisation.", 'error');     return; }

    // ── État chargement ───────────────────────────────────────────────────
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">sync</span> Inscription...';

    try {
      const response = await fetch('/api/auth/signup', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          username: email.split('@')[0] + '_' + Date.now().toString().slice(-4),
          password,
          full_name,
          phone
        })
      });

      const data = await response.json();

      if (response.ok) {
        // Stocker session et token
        sessionStorage.setItem('shopai_session', JSON.stringify({
          name:   full_name,
          email:  email,
          role:   data.role || 'user',
          avatar: full_name.charAt(0).toUpperCase()
        }));
        if (data.token) {
          sessionStorage.setItem('shopai_token', data.token);
          localStorage.setItem('shopai_token', data.token);
        }
        toast('Inscription réussie ! Redirection...', 'success');
        setTimeout(() => { window.location.href = '/onboarding'; }, 1200);

      } else if (response.status === 409) {
        toast('Cet email est déjà utilisé. Connectez-vous ou utilisez un autre email.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Continuer <span class="material-symbols-outlined">arrow_forward</span>';

      } else {
        toast(data.error || "Erreur lors de l'inscription.", 'error');
        btn.disabled = false;
        btn.innerHTML = 'Continuer <span class="material-symbols-outlined">arrow_forward</span>';
      }

    } catch (err) {
      console.error('Signup error:', err);
      toast('Impossible de joindre le serveur. Vérifiez que Flask tourne sur le port 8000.', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Continuer <span class="material-symbols-outlined">arrow_forward</span>';
    }
  });
</script>

<!-- Scripts chargés après le script inline -->
<script src="/static/js/auth.js"></script>
<script src="/static/js/nav.js"></script>
<script src="/static/js/page-links.js"></script>

</body>
</html>
