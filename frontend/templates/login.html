<script>
        // Toggle Password Visibility Logic

        // Si auth.js n'est pas chargÃ© (mauvais chemin), on stop pour Ã©viter un faux submit.
        if (!window.ShopAIAuth || typeof window.ShopAIAuth.login !== 'function') {
            console.error('ShopAIAuth non disponible: auth.js non chargÃ©');
        }
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const visibilityIcon = togglePassword.querySelector('.material-symbols-outlined');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            visibilityIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Auth Login wiring
        const loginForm = document.querySelector('#loginForm');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = loginForm.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Connexion...</span>';
            btn.disabled = true;

            const email = document.querySelector('#email')?.value?.trim();
            const password = document.querySelector('#password')?.value;

            // shopai/auth.js redirige dÃ©jÃ  en cas de succÃ¨s
            const ok = await (window.ShopAIAuth?.login?.(email, password));
            if (!ok) {
                btn.disabled = false;
                btn.textContent = 'Se connecter';
                return;
            }

            // fallback sÃ©curitÃ© si la redirection ne se dÃ©clenche pas
            setTimeout(() => {
                const user = window.ShopAIAuth?.getUser?.();
                const role = user?.role;
                window.location.href = role === 'admin' ? '/dashboard' : '/';
            }, 200);

        });

        // Navigation helper
        // (nav.js gÃ¨re aussi l'Ã©tat actif et le logout, mais sur la page login il n'y a rien)
    </script>
